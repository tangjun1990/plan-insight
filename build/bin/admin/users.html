<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户管理 - 审美数据分析系统</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "微软雅黑", Arial, sans-serif;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }
        .nav-links {
            display: flex;
            gap: 20px;
        }
        .nav-links a {
            text-decoration: none;
            color: #007bff;
        }
        .logout-btn {
            padding: 8px 16px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .data-table th, .data-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        .data-table th {
            background-color: #f8f9fa;
        }
        .pagination {
            margin-top: 20px;
            text-align: center;
        }
        .pagination button {
            margin: 0 5px;
            padding: 5px 10px;
            cursor: pointer;
        }
        .pagination button.active {
            background-color: #007bff;
            color: white;
            border: none;
        }
        .page-layout {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 200px;
            background-color: #2c3e50;
            padding: 20px 0;
            color: white;
        }
        .sidebar h2 {
            padding: 0 20px;
            margin-bottom: 30px;
            font-size: 18px;
            color: #ecf0f1;
        }
        .nav-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .nav-menu li {
            padding: 10px 20px;
            cursor: pointer;
        }
        .nav-menu li:hover {
            background-color: #34495e;
        }
        .nav-menu a {
            color: #ecf0f1;
            text-decoration: none;
            display: block;
        }
        .nav-menu li.active {
            background-color: #3498db;
        }
        .main-content {
            flex: 1;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .logout-btn {
            padding: 8px 16px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .logout-btn:hover {
            background-color: #c0392b;
        }
        .status-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
        }
        .status-active {
            background-color: #e6f7e6;
            color: #28a745;
        }
        .status-disabled {
            background-color: #f8d7da;
            color: #dc3545;
        }
        .action-btn {
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
        }
        .enable-btn {
            background-color: #28a745;
        }
        .disable-btn {
            background-color: #dc3545;
        }
        .hidden { display: none; }
        .search-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            margin-bottom: 12px;
        }
        .search-input {
            padding: 6px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-overlay.hidden { display: none; }
        .modal {
            background: #fff;
            width: 380px;
            border-radius: 8px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .modal-header {
            padding: 14px 16px;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 1px solid #eee;
        }
        .modal-body { padding: 14px 16px; }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 12px 16px;
            border-top: 1px solid #eee;
        }
        .radio-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .radio-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid #eee; border-radius: 6px; }
        .batch-btn { background-color: #6f42c1; }
        .batch-btn:hover { background-color: #5b34a1; }
        .modal-wide { width: 520px; }
        .form-label { display: block; font-weight: 600; margin-bottom: 8px; }
        .phone-textarea {
            width: 100%;
            min-height: 180px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px;
            resize: vertical;
            font-family: inherit;
            line-height: 1.6;
        }
        .form-help {
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }
        .duration-section { margin-top: 16px; }
    </style>
</head>
<body>
    <div class="page-layout">
        <div class="sidebar">
            <h2>审美数据分析系统</h2>
            <ul class="nav-menu">
                <li><a href="index">数据分析</a></li>
                <li class="active"><a href="users">用户管理</a></li>
            </ul>
        </div>
        <div class="main-content">
            <div class="container">
                <div class="header">
                    <button class="logout-btn" onclick="handleLogout()">退出登录</button>
                </div>
                <h1>用户管理</h1>
                <div class="search-bar">
                    <input id="searchPhone" class="search-input" type="text" placeholder="请输入手机号" />
                    <button class="action-btn enable-btn" onclick="handleSearch()">搜索</button>
                    <button class="action-btn disable-btn" onclick="resetSearch()">重置</button>
                    <button class="action-btn batch-btn" onclick="showBatchProModal()">批量开通Pro</button>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>姓名</th>
                            <th>手机号</th>
                            <th>性别</th>
                            <th>年龄</th>
                            <th>所在地区</th>
                            <th>注册时间</th>
                            <th>Pro到期时间</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody"></tbody>
                </table>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>
    </div>
    <!-- Pro 开通弹窗 -->
    <div id="proModal" class="modal-overlay hidden" onclick="onModalBackdropClick(event)">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="proModalTitle">
            <div class="modal-header" id="proModalTitle">选择开通Pro时长</div>
            <div class="modal-body">
                <div class="radio-group">
                    <label class="radio-item"><input type="radio" name="proDuration" value="30" checked>30天</label>
                    <label class="radio-item"><input type="radio" name="proDuration" value="90">90天</label>
                    <label class="radio-item"><input type="radio" name="proDuration" value="180">180天</label>
                    <label class="radio-item"><input type="radio" name="proDuration" value="365">365天</label>
                </div>
            </div>
            <div class="modal-actions">
                <button class="action-btn disable-btn" onclick="closeProModal()">取消</button>
                <button class="action-btn enable-btn" onclick="confirmOpenPro()">确认开通</button>
            </div>
        </div>
    </div>
    <div id="batchProModal" class="modal-overlay hidden" onclick="onBatchModalBackdropClick(event)">
        <div class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="batchProModalTitle">
            <div class="modal-header" id="batchProModalTitle">批量开通Pro</div>
            <div class="modal-body">
                <label class="form-label" for="batchPhoneInput">手机号列表</label>
                <textarea id="batchPhoneInput" class="phone-textarea" placeholder="请输入手机号，一行一个，最多200个"></textarea>
                <div class="form-help">支持换行输入多个手机号，系统会自动去重并忽略空行，最多 200 个。</div>
                <div class="duration-section">
                    <label class="form-label">开通时长</label>
                    <div class="radio-group">
                        <label class="radio-item"><input type="radio" name="batchProDuration" value="30" checked>30天</label>
                        <label class="radio-item"><input type="radio" name="batchProDuration" value="90">90天</label>
                        <label class="radio-item"><input type="radio" name="batchProDuration" value="180">180天</label>
                        <label class="radio-item"><input type="radio" name="batchProDuration" value="365">365天</label>
                    </div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="action-btn disable-btn" onclick="closeBatchProModal()">取消</button>
                <button class="action-btn enable-btn" onclick="confirmBatchOpenPro()">确认开通</button>
            </div>
        </div>
    </div>
    <script>
        // 检查登录状态
        function checkLogin() {
            if (isPreview()) return; // 预览模式跳过登录检查
            const tokenExpire = localStorage.getItem('tokenExpire');
            const isTokenValid = tokenExpire && (parseInt(tokenExpire) > Date.now());
            
            if (!isTokenValid || localStorage.getItem('isLoggedIn') !== 'true') {
                window.location.href = 'login';
            }
        }

        function isPreview() {
            try {
                const params = new URLSearchParams(window.location.search);
                return params.get('preview') === '1';
            } catch (e) { return false; }
        }

        // 退出登录
        function handleLogout() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('adminToken');
            localStorage.removeItem('tokenExpire');
            window.location.href = 'login';
        }

        // API请求基础函数
        async function fetchAPI(url, method = 'GET', body = null) {
            const token = localStorage.getItem('adminToken');
            const headers = {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            };

            const options = {
                method: method,
                headers: headers
            };

            if (body && (method === 'POST' || method === 'PUT')) {
                options.body = JSON.stringify(body);
            }

            try {
                const response = await fetch(url, options);
                const data = await response.json();

                if (data.code !== 0) {
                    throw new Error(data.message || '请求失败');
                }

                return data.data;
            } catch (error) {
                console.error('API请求出错:', error);
                alert('操作失败: ' + error.message);
                throw error;
            }
        }

        // 获取用户列表
        async function fetchUserList(page = 1, pageSize = 10, filters = {}) {
            let queryParams = 'page=' + page + '&page_size=' + pageSize;
            
            if (filters.phone) {
                queryParams += '&phone=' + encodeURIComponent(filters.phone);
            }
            
            if (filters.status !== undefined) {
                queryParams += '&status=' + filters.status;
            }
            
            return await fetchAPI('/admin/user/list?' + queryParams);
        }

        // 启用用户
        async function enableUser(userId) {
            return await fetchAPI('/admin/user/' + userId + '/enable', 'PUT');
        }

        // 禁用用户
        async function disableUser(userId) {
            return await fetchAPI('/admin/user/' + userId + '/disable', 'PUT');
        }

        async function batchOpenPro(phones, days) {
            return await fetchAPI('/admin/user/pro/open/batch', 'POST', { phones, days });
        }

        // 渲染用户表格
        function renderUserTable(userData) {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';

            userData.list.forEach((user) => {
                const row = document.createElement('tr');
                const proExpireText = formatDate(user.pro_expire_at);
                const now = new Date();
                const isProActive = (user.is_pro === 1) && user.pro_expire_at && (new Date(user.pro_expire_at) > now);
                row.innerHTML = '<td>' + (user.name || '-') + '</td>' +
                    '<td>' + (user.phone || '-') + '</td>' +
                    '<td>' + (user.gender || '-') + '</td>' +
                    '<td>' + (user.age || '-') + '</td>' +
                    '<td>' + (user.city || '-') + '</td>' +
                    '<td>' + formatDate(user.first_login_time) + '</td>' +
                    '<td>' + (proExpireText || '-') + '</td>' +
                    '<td><span class="status-badge ' + (user.status === 1 ? 'status-active' : 'status-disabled') + '">' +
                    (user.status === 1 ? '正常' : '禁用中') + '</span></td>' +
                    '<td>' +
                      '<button class="action-btn ' + (user.status === 1 ? 'disable-btn' : 'enable-btn') + '" ' +
                      'onclick="toggleUserStatus(' + user.id + ', ' + user.status + ')">' +
                      (user.status === 1 ? '禁用' : '启用') + '</button>' +
                      '<button class="action-btn enable-btn" style="margin-left:8px;" onclick="showProModal(' + user.id + ')">开通Pro</button>' +
                    '</td>';
                tbody.appendChild(row);
            });

            renderPagination(userData.total, userData.page, userData.page_size);
        }

        // 格式化日期
        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return isNaN(date.getTime()) ? dateStr : date.toLocaleDateString('zh-CN');
        }

        // 渲染分页
        function renderPagination(total, currentPage, pageSize) {
            const totalPages = Math.ceil(total / pageSize);
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';

            const addBtn = (label, page, disabled = false, active = false) => {
                const btn = document.createElement('button');
                btn.textContent = label;
                if (disabled) {
                    btn.disabled = true;
                } else {
                    btn.onclick = () => loadUserData(page, pageSize);
                }
                if (active) btn.classList.add('active');
                pagination.appendChild(btn);
            };

            // 上一页
            addBtn('上一页', Math.max(1, currentPage - 1), currentPage === 1);

            if (totalPages <= 10) {
                for (let i = 1; i <= totalPages; i++) {
                    addBtn(String(i), i, false, i === currentPage);
                }
            } else {
                // 前5页
                for (let i = 1; i <= 5; i++) {
                    addBtn(String(i), i, false, i === currentPage);
                }
                const ellipsis = document.createElement('span');
                ellipsis.textContent = '...';
                ellipsis.style.margin = '0 6px';
                pagination.appendChild(ellipsis);
                // 后5页
                for (let i = totalPages - 4; i <= totalPages; i++) {
                    addBtn(String(i), i, false, i === currentPage);
                }
            }

            // 下一页
            addBtn('下一页', Math.min(totalPages, currentPage + 1), currentPage === totalPages);
        }

        // 切换用户状态
        async function toggleUserStatus(userId, currentStatus) {
            try {
                if (currentStatus === 1) {
                    await disableUser(userId);
                } else {
                    await enableUser(userId);
                }
                // 操作成功后重新加载当前页数据
                await loadUserData(currentPage, pageSize);
            } catch (error) {
                console.error('切换用户状态失败:', error);
            }
        }

        // Pro 弹窗交互
        let proModalUserId = null;
        function showProModal(userId) {
            proModalUserId = userId;
            // default select 30 days
            const first = document.querySelector('input[name="proDuration"][value="30"]');
            if (first) first.checked = true;
            document.getElementById('proModal').classList.remove('hidden');
        }
        function closeProModal() {
            document.getElementById('proModal').classList.add('hidden');
            proModalUserId = null;
        }
        async function confirmOpenPro() {
            try {
                const checked = document.querySelector('input[name="proDuration"]:checked');
                const days = parseInt(checked ? checked.value : '30', 10);
                await fetchAPI('/admin/user/' + proModalUserId + '/pro/open', 'POST', { days });
                alert('开通成功');
                closeProModal();
                await loadUserData(currentPage, pageSize);
            } catch (error) {
                console.error('开通Pro失败:', error);
            }
        }
        function onModalBackdropClick(e) {
            if (e.target && e.target.id === 'proModal') {
                closeProModal();
            }
        }

        function showBatchProModal() {
            const first = document.querySelector('input[name="batchProDuration"][value="30"]');
            if (first) first.checked = true;
            const input = document.getElementById('batchPhoneInput');
            if (input) input.value = '';
            document.getElementById('batchProModal').classList.remove('hidden');
        }

        function closeBatchProModal() {
            document.getElementById('batchProModal').classList.add('hidden');
        }

        function onBatchModalBackdropClick(e) {
            if (e.target && e.target.id === 'batchProModal') {
                closeBatchProModal();
            }
        }

        function parseBatchPhones(rawText) {
            const parts = rawText
                .split(/\r?\n/)
                .map(item => item.trim())
                .filter(Boolean);
            return Array.from(new Set(parts));
        }

        async function confirmBatchOpenPro() {
            try {
                const input = document.getElementById('batchPhoneInput');
                const phones = parseBatchPhones(input ? input.value : '');
                if (phones.length === 0) {
                    alert('请先输入手机号');
                    return;
                }
                if (phones.length > 200) {
                    alert('单次最多支持200个手机号');
                    return;
                }

                const checked = document.querySelector('input[name="batchProDuration"]:checked');
                const days = parseInt(checked ? checked.value : '30', 10);
                const result = await batchOpenPro(phones, days);

                let message = '批量开通完成\n' +
                    '输入数量：' + result.total_input + '\n' +
                    '去重后数量：' + result.unique_phones + '\n' +
                    '成功数量：' + result.success_count;
                if (result.not_found_phones && result.not_found_phones.length > 0) {
                    message += '\n未找到手机号：' + result.not_found_phones.join('、');
                }

                alert(message);
                closeBatchProModal();
                await loadUserData(currentPage, pageSize);
            } catch (error) {
                console.error('批量开通Pro失败:', error);
            }
        }

        // 加载用户数据
        async function loadUserData(page = 1, size = 10) {
            try {
                showLoading();
                const userData = await fetchUserList(page, size, currentFilter || {});
                renderUserTable(userData);
                currentPage = page;
                pageSize = size;
                hideLoading();
            } catch (error) {
                hideLoading();
                console.error('加载用户数据失败:', error);
            }
        }

        // 显示加载状态
        function showLoading() {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '<tr><td colspan="9" style="text-align: center;">加载中...</td></tr>';
        }

        // 隐藏加载状态
        function hideLoading() {
            // 由渲染表格函数处理
        }

        // 初始化
        let currentPage = 1;
        let pageSize = 10;
        let currentFilter = { phone: '' };

        function handleSearch() {
            const phoneInput = document.getElementById('searchPhone');
            const phone = phoneInput ? phoneInput.value.trim() : '';
            currentFilter.phone = phone;
            loadUserData(1, pageSize);
        }

        function resetSearch() {
            const phoneInput = document.getElementById('searchPhone');
            if (phoneInput) phoneInput.value = '';
            currentFilter.phone = '';
            loadUserData(1, pageSize);
        }
        
        window.onload = function() {
            checkLogin();
            if (!isPreview()) {
                loadUserData();
            }
        };
    </script>
</body>
</html>
